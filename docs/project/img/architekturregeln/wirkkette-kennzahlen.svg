0 360,30 360,66" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><text x="440" y="30" fill="#475569" text-anchor="middle" font-size="11">Rückkopplung</text><line x1="280" y1="48" x2="280" y2="135" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/><text x="280" y="150" fill="#475569" text-anchor="middle" font-size="11">Modulgrenze</text><text x="360" y="128" fill="#475569" text-anchor="middle" font-size="11">geteilt mit anderen Ketten</text><text x="20" y="190" fill="#0f172a" text-anchor="start" font-size="13" font-weight="bold">Gemessen je Kette:</text><text x="20" y="212" fill="#0f172a" text-anchor="start" font-size="13">Länge 3 · Verzweigung 1 · Modulgrenzen 1 · Rückkopplungen 1 · geteilte Funktionen 1 · Engstellen</text><text x="20" y="246" fill="#0f172a" text-anchor="start" font-size="13" font-weight="bold">Leer und zur Streichung vorgeschlagen:</text><text x="20" y="268" fill="#dc2626" text-anchor="start" font-size="13" text-decoration="line-through">synchrone Tiefe</text><text x="135" y="268" fill="#475569" text-anchor="start" font-size="12">ersetzt durch den Antwortweg: die Glieder, auf die die Antwort wartet</text><text x="20" y="288" fill="#dc2626" text-anchor="start" font-size="13" text-decoration="line-through">Fehlerpfad-Tiefe</text><text x="135" y="288" fill="#475569" text-anchor="start" font-size="12">kein Fluss ist als Fehlerfluss markiert; die Entscheidung trägt die FMEA</text></svg>
