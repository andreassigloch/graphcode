<rect x="140" y="372" width="320" height="52" rx="6" fill="#f8d7da" stroke="#c0392b" stroke-width="1.5"/><text x="300" y="394" text-anchor="middle" font-size="12.5" fill="#222">⑤ Regel-Gate: neuer Fehler durch die Änderung?</text><text x="300" y="411" text-anchor="middle" font-size="10.5" fill="#555">deterministische Prüfung gegen den Stand davor — keine KI</text>
