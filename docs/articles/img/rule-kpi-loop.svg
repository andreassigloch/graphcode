<line x1="300" y1="288" x2="300" y2="302" stroke="#888" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="140" y="304" width="320" height="52" rx="6" fill="#f3f3f3" stroke="#888888" stroke-width="1.5"/><text x="300" y="326" text-anchor="middle" font-size="12.5" fill="#222">④ Zug: der Nutzer entscheidet, der Agent schreibt</text><text x="300" y="343" text-anchor="middle" font-size="10.5" fill="#555">Claude Code oder OpenCode — gleicher Weg für beide</text>
