<text x="480" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Regeln stoppen Fehler. Kennzahlen zeigen den Weg.</text>
<text x="480" y="54" text-anchor="middle" font-size="12" fill="#555">Die Steuerungsschleife — alle Zahlen aus dem graphcode-Graphen selbst, Stand 09.10.2026</text>
<text x="300" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Jede Änderung: ein Durchlauf</text>
<rect x="140" y="100" width="320" height="52" rx="6" fill="#d6eaf8" stroke="#2874a6" stroke-width="1.5"/><text x="300" y="122" text-anchor="middle" font-size="12.5" fill="#222">① Messen: alle Regeln über den ganzen Graphen</text><text x="300" y="139" text-anchor="middle" font-size="10.5" fill="#555">Befunde je Stufe — heute früheste Stufe mit Befund: Anforderung</text>
<line x1="300" y1="152" x2="300" y2="166" stroke="#888" stroke-width="1.5" marker-end="url(#ag)"/>
