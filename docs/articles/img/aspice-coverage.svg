    rect.g { stroke:#2e7d32; }
    rect.y { stroke:#e0a106; }
    rect.r { stroke:#c62828; }
    rect.na{ stroke:#777; stroke-width:2; stroke-dasharray:6 4; }
    rect.sh{ fill:#ececec; stroke:#b8b8b8; stroke-width:1.2; }
    .id    { font-size:12px; font-weight:bold; fill:#111; text-anchor:middle; }
    .nm    { font-size:10px; fill:#111; text-anchor:middle; }
    g.dim .id, g.dim .nm { fill:#999; }
    .lg    { font-size:12px; fill:#222; }
  </style>

  <rect x="0" y="0" width="1350" height="760" fill="#ffffff"/>

