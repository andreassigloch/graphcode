<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="760" viewBox="0 0 1350 760" font-family="Helvetica, Arial, sans-serif">
  <style>
    .grp   { fill:#ffffff; stroke:#444; stroke-width:1.3; }
    .gt    { font-size:13px; font-weight:bold; fill:#222; text-anchor:middle; }
