<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="760" height="560" fill="#ffffff"/>
<defs><marker id="arrowpg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>

<!-- gate ladder -->
<rect x="20" y="30" width="160" height="40" rx="6" fill="#f3f3f3" stroke="#888888" stroke-width="1.5"/>
<text x="100" y="49" text-anchor="middle" font-size="12.5" fill="#222">SRR</text>
<text x="100" y="63" text-anchor="middle" font-size="10.5" fill="#555">requirements review</text>
<rect x="210" y="30" width="160" height="40" rx="6" fill="#f3f3f3" stroke="#888888" stroke-width="1.5"/>
<text x="290" y="49" text-anchor="middle" font-size="12.5" fill="#222">PDR</text>
<text x="290" y="63" text-anchor="middle" font-size="10.5" fill="#555">design review</text>
<rect x="400" y="30" width="160" height="40" rx="6" fill="#f3f3f3" stroke="#888888" stroke-width="1.5"/>
<text x="480" y="49" text-anchor="middle" font-size="12.5" fill="#222">CDR</text>
<text x="480" y="63" text-anchor="middle" font-size="10.5" fill="#555">interface review</text>
<rect x="590" y="30" width="150" height="40" rx="6" fill="#f3f3f3" stroke="#888888" stroke-width="1.5"/>
<text x="665" y="49" text-anchor="middle" font-size="12.5" fill="#222">TRR</text>
<text x="665" y="63" text-anchor="middle" font-size="10.5" fill="#555">test readiness</text>
<line x1="180" y1="50" x2="208" y2="50" stroke="#888" stroke-width="1.5" marker-end="url(#arrowpg)"/>
<line x1="370" y1="50" x2="398" y2="50" stroke="#888" stroke-width="1.5" marker-end="url(#arrowpg)"/>
<line x1="560" y1="50" x2="588" y2="50" stroke="#888" stroke-width="1.5" marker-end="url(#arrowpg)"/>

<!-- row labels -->
<text x="14" y="132" font-size="10.5" fill="#c0392b" transform="rotate(-90 14 132)" text-anchor="middle">rule legs</text>
<text x="14" y="235" font-size="10.5" fill="#c0392b" transform="rotate(-90 14 235)" text-anchor="middle">layer present</text>
<text x="14" y="352" font-size="10.5" fill="#7d3c98" transform="rotate(-90 14 352)" text-anchor="middle">analysis fresh</text>

<!-- rule legs row (red, filled) -->
<rect x="20" y="95" width="160" height="72" rx="6" fill="#f8d7da" stroke="#c0392b" stroke-width="1.5"/>
<text x="100" y="115" text-anchor="middle" font-size="11" fill="#222">every UC has REQs</text>
<text x="100" y="130" text-anchor="middle" font-size="11" fill="#222">every UC has a chain</text>
<text x="100" y="145" text-anchor="middle" font-size="11" fill="#222">system has UCs</text>
<rect x="210" y="95" width="160" height="72" rx="6" fill="#f8d7da" stroke="#c0392b" stroke-width="1.5"/>
<text x="290" y="115" text-anchor="middle" font-size="11" fill="#222">every chain has FUNCs</text>
<text x="290" y="130" text-anchor="middle" font-size="11" fill="#222">every chain has a</text>
<text x="290" y="145" text-anchor="middle" font-size="11" fill="#222">trigger and a consumer</text>
<rect x="400" y="95" width="160" height="72" rx="6" fill="#f8d7da" stroke="#c0392b" stroke-width="1.5"/>
<text x="480" y="115" text-anchor="middle" font-size="11" fill="#222">every FLOW carries</text>
<text x="480" y="130" text-anchor="middle" font-size="11" fill="#222">a data contract</text>
<text x="480" y="145" text-anchor="middle" font-size="11" fill="#222">(SCHEMA)</text>
<rect x="590" y="95" width="150" height="72" rx="6" fill="#f8d7da" stroke="#c0392b" stroke-width="1.5"/>
<text x="665" y="115" text-anchor="middle" font-size="11" fill="#222">every TEST bound</text>
<text x="665" y="130" text-anchor="middle" font-size="11" fill="#222">to a test file, every</text>
<text x="665" y="145" text-anchor="middle" font-size="11" fill="#222">leaf FUNC to code</text>

<!-- layer presence row (red outline, light fill) -->
<rect x="20" y="200" width="160" height="60" rx="6" fill="#fdf4f5" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="100" y="233" text-anchor="middle" font-size="11" fill="#555">—</text>
<rect x="210" y="200" width="160" height="60" rx="6" fill="#fdf4f5" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="290" y="219" text-anchor="middle" font-size="11" fill="#222">once &gt;1 FUNC exists:</text>
<text x="290" y="233" text-anchor="middle" font-size="11" fill="#222">FLOW and SCHEMA</text>
<text x="290" y="247" text-anchor="middle" font-size="11" fill="#222">(one combined check)</text>
<rect x="400" y="200" width="160" height="60" rx="6" fill="#fdf4f5" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="480" y="233" text-anchor="middle" font-size="11" fill="#555">—</text>
<rect x="590" y="200" width="150" height="60" rx="6" fill="#fdf4f5" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="665" y="233" text-anchor="middle" font-size="11" fill="#555">—</text>
<text x="378" y="282" text-anchor="middle" font-size="10.5" fill="#c0392b">catches what no per-element rule can fire on: a whole layer that was never built</text>

<!-- analysis freshness row (purple) -->
<rect x="20" y="310" width="160" height="86" rx="6" fill="#e8daef" stroke="#7d3c98" stroke-width="1.5"/>
<text x="100" y="352" text-anchor="middle" font-size="11" fill="#555">—</text>
<rect x="210" y="310" width="160" height="86" rx="6" fill="#e8daef" stroke="#7d3c98" stroke-width="1.5"/>
<text x="290" y="326" text-anchor="middle" font-size="11" fill="#222">Concept of Operations</text>
<text x="290" y="339" text-anchor="middle" font-size="11" fill="#222">Trade Study</text>
<text x="290" y="352" text-anchor="middle" font-size="11" fill="#222">Assumption Review</text>
<text x="290" y="371" text-anchor="middle" font-size="10" fill="#555">exists + fresh?</text>
<rect x="400" y="310" width="160" height="86" rx="6" fill="#e8daef" stroke="#7d3c98" stroke-width="1.5"/>
<text x="480" y="340" text-anchor="middle" font-size="11" fill="#222">FMEA</text>
<text x="480" y="368" text-anchor="middle" font-size="10" fill="#555">exists + fresh?</text>
<rect x="590" y="310" width="150" height="86" rx="6" fill="#e8daef" stroke="#7d3c98" stroke-width="1.5"/>
<text x="665" y="340" text-anchor="middle" font-size="11" fill="#222">Implementation Plan</text>
<text x="665" y="368" text-anchor="middle" font-size="10" fill="#555">exists + fresh?</text>

<!-- staleness loop -->
<rect x="250" y="450" width="260" height="44" rx="6" fill="#f3f3f3" stroke="#888888" stroke-width="1.5"/>
<text x="380" y="469" text-anchor="middle" font-size="12" fill="#222">the graph keeps changing</text>
<text x="380" y="484" text-anchor="middle" font-size="10.5" fill="#555">every applied edit moves the analyzed scope</text>
<path d="M250,472 L290,472 L290,398" fill="none" stroke="#7d3c98" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowpg)"/>
<text x="130" y="440" font-size="10.5" fill="#7d3c98">scope moved →</text>
<text x="130" y="453" font-size="10.5" fill="#7d3c98">analysis stale →</text>
<text x="130" y="466" font-size="10.5" fill="#7d3c98">gate re-opens</text>

<!-- legend -->
<rect x="530" y="440" width="14" height="14" fill="#f8d7da" stroke="#c0392b" stroke-width="1.2"/>
<text x="550" y="451" font-size="10.5" fill="#222">yes/no check, computed from the graph</text>
<rect x="530" y="462" width="14" height="14" fill="#e8daef" stroke="#7d3c98" stroke-width="1.2"/>
<text x="550" y="473" font-size="10.5" fill="#222">human judgment artifact — gate checks</text>
<text x="550" y="485" font-size="10.5" fill="#222">only that it exists and is fresh, never inside</text>
</svg>
