name: CI

# Build + test on a fresh checkout. Possible since CR-GC-262: the five @sigloch/*
# dependencies come from the npm registry (CR-214), so a checkout of the private
# sigloch-modules repo is no longer needed to build this repo.
#
# The suite runs a real on-disk Kuzu store and a real `npm pack` + foreign install —
# no mocks — so it needs a few minutes, not seconds. On 2026-11-21 three runs in a row hit the
# 20-minute limit (suite grown from 246 to about 270 files), so the suite runs as two parallel
# jobs, one half each (`vitest --shard=<n>/2`, CR-GC-988). Every file runs in exactly one half;
# type-check and build run in both, because the tests import the build output.
#
# master + PRs only, not every branch push: with one committer the regression signal is
# already there locally. What CI adds is the CLEAN MACHINE — no local .graphcode/, no
# linked siblings, no warm cache — and that only needs to run where work lands.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    name: build-test (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          # whitebox-messung.test liest Jobs aus der Git-Historie; der flache Checkout hat keine (CR-GC-969).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test (half ${{ matrix.shard }} of 2)
        run: npx vitest run --shard=${{ matrix.shard }}/2
